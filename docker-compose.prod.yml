services:
  report:
    build:
      context: .
    container_name: eventomax-report-prod
    restart: always
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-report-group}
      KAFKA_CONSUMER_AUTO_STARTUP: ${KAFKA_CONSUMER_AUTO_STARTUP:-true}
      KAFKA_TOPIC_PRODUCTION_EVENTS: ${KAFKA_TOPIC_PRODUCTION_EVENTS:-productions.events}
      KAFKA_TOPIC_REPORT_DLT: ${KAFKA_TOPIC_REPORT_DLT:-productions.events.report.DLT}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    networks:
      - eventomax-net

networks:
  eventomax-net:
    external: true

