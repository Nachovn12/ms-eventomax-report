services:
  report:
    build:
      context: .
    container_name: eventomax-report-prod
    mem_limit: 512m
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: ${DB_SCHEMA:-report}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${DB_SCHEMA:-report}
      SPRING_FLYWAY_SCHEMAS: ${DB_SCHEMA:-report}
      SPRING_FLYWAY_CREATE_SCHEMAS: ${FLYWAY_CREATE_SCHEMAS:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-report-group}
      KAFKA_CONSUMER_AUTO_STARTUP: ${KAFKA_CONSUMER_AUTO_STARTUP:-false}
      KAFKA_TOPIC_PRODUCTION_EVENTS: ${KAFKA_TOPIC_PRODUCTION_EVENTS:-productions.events}
      KAFKA_TOPIC_REPORT_DLT: ${KAFKA_TOPIC_REPORT_DLT:-productions.events.report.DLT}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:?ENTRA_ISSUER_URI is required}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?ENTRA_AUDIENCE is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      eventomax-net:
        aliases:
          - ms-eventomax-report

networks:
  eventomax-net:
    external: true
