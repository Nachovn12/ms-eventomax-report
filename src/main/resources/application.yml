spring:
  application:
    name: ms-eventomax-report

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:report-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}

app:
  kafka:
    topic:
      production-events: ${KAFKA_TOPIC_PRODUCTION_EVENTS:productions.events}
      report-dlt: ${KAFKA_TOPIC_REPORT_DLT:productions.events.report.DLT}
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-interval-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
