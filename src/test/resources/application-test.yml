spring:
  datasource:
    url: jdbc:h2:mem:reportdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  kafka:
    # Disable or mock Kafka for tests
    bootstrap-servers: localhost:9092
